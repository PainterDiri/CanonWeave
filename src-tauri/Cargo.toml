[package]
name = "canonweave"
version = "0.1.0"
description = "CanonWeave - Keep every story whole."
authors = ["CanonWeave"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "canonweave_lib"
# 仅桌面端：staticlib/cdylib 只服务移动端，会在每个 profile 额外产出数百 MB 产物。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled", "chrono", "serde_json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"
unicode-segmentation = "1"
jieba-rs = "0.7"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
futures-util = "0.3"
specta = { version = "2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }
walkdir = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
encoding_rs = "0.8"
petgraph = "0.8"

[dev-dependencies]
tempfile = "3"

# 构建体积控制：依赖不生成调试信息，增量产物与最终应用都保持轻量。
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
